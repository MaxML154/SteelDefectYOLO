model: yolov8n.pt
epochs: 150

train_params:
  imgsz: 640
  batch: 16
  workers: 4
  patience: 50

  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005

  box: 7.5
  cls: 0.5
  dfl: 1.5

  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  auto_augment: null
  erasing: 0.0

  close_mosaic: 10
  iou: 0.6
  dropout: 0.1

  conf: 0.001
  max_det: 300

  cos_lr: true
  save_period: 10
